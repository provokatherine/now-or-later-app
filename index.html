<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 16px 24px;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #000);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow-wrap: anywhere;
  }
  h2 { font-size: 17px; margin: 20px 0 4px; }
  .count, .empty, .outside { color: var(--tg-theme-hint-color, #999); font-weight: normal; }
  .empty, .outside { margin: 20px 0 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 0;
    border-bottom: 1px solid var(--tg-theme-secondary-bg-color, #eee);
    transition: opacity .15s;
  }
  li.fading { opacity: .3; }
  .text { flex: 1 1 160px; min-width: 0; }
  .actions { display: flex; gap: 6px; margin-left: auto; }
  button {
    font: inherit;
    font-size: 14px;
    padding: 4px 10px;
    border: 0;
    border-radius: 8px;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #fff);
  }
  button[data-action="never"] {
    background: var(--tg-theme-secondary-bg-color, #eee);
    color: var(--tg-theme-text-color, #000);
  }
  button:disabled { opacity: .5; }
  #banner {
    position: sticky;
    top: 0;
    margin: 0 -16px;
    padding: 8px 16px;
    background: var(--tg-theme-secondary-bg-color, #eee);
    color: var(--tg-theme-text-color, #000);
  }
  #banner[hidden] { display: none; }
</style>
</head>
<body>
<div id="banner" hidden></div>
<main id="list"></main>
<template id="buttons"><button data-action="today">Today</button><button data-action="later">Later</button><button data-action="never">✕</button></template>
<script>
  const tg = window.Telegram?.WebApp;
  const initData = tg?.initData ?? "";
  const list = document.getElementById("list");
  const banner = document.getElementById("banner");
  const buttons = document.getElementById("buttons").content;
  // Filled by renderPage: the function's API, absolute when the page is hosted elsewhere.
  const api = "https://yonytrycngydbxxnblqv.supabase.co/functions/v1/today-bot/app/api";
  let bannerTimer = null;
  const pending = new Set();
  let lastSeq = 0;

  async function post(body) {
    const res = await fetch(api, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ initData, ...body }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  function showError(message, { sticky = false } = {}) {
    banner.textContent = message;
    banner.hidden = false;
    clearTimeout(bannerTimer);
    if (!sticky) bannerTimer = setTimeout(() => { banner.hidden = true; }, 3000);
  }

  function hideError() {
    clearTimeout(bannerTimer);
    banner.hidden = true;
  }

  function lock(li) {
    li.classList.add("fading");
    li.querySelectorAll("button").forEach((b) => { b.disabled = true; });
  }

  function unlock(id) {
    const li = [...list.querySelectorAll("li[data-id]")].find((x) => x.dataset.id === id);
    if (!li) return;
    li.classList.remove("fading");
    li.querySelectorAll("button").forEach((b) => { b.disabled = false; });
  }

  function hint(className, message) {
    const p = document.createElement("p");
    p.className = className;
    p.textContent = message;
    return p;
  }

  function byCreated(a, b) {
    return a.createdAt < b.createdAt ? -1 : a.createdAt > b.createdAt ? 1 : 0;
  }

  function byTodayOrder(a, b) {
    const x = a.todayOrder ?? Infinity;
    const y = b.todayOrder ?? Infinity;
    return x !== y ? x - y : byCreated(a, b);
  }

  function button(action) {
    return buttons.querySelector('[data-action="' + action + '"]').cloneNode(true);
  }

  function line(task, actions, lead) {
    const li = document.createElement("li");
    li.dataset.id = task.id;
    const text = document.createElement("span");
    text.className = "text";
    text.textContent = (lead ? "▶ " : "") + task.description;
    li.append(text);
    if (actions.length > 0) {
      const box = document.createElement("span");
      box.className = "actions";
      for (const a of actions) box.append(button(a));
      li.append(box);
    }
    return li;
  }

  function group(title, tasks, actions, leadFirst) {
    const section = document.createElement("section");
    const h2 = document.createElement("h2");
    const count = document.createElement("span");
    count.className = "count";
    count.textContent = String(tasks.length);
    h2.append(title + " ", count);
    const ul = document.createElement("ul");
    tasks.forEach((t, i) => ul.append(line(t, actions, leadFirst && i === 0)));
    section.append(h2, ul);
    return section;
  }

  function render(tasks) {
    const inbox = tasks.filter((t) => t.status === "pending").sort(byCreated);
    const later = tasks.filter((t) => t.status === "later").sort(byCreated);
    const today = tasks.filter((t) => t.status === "today").sort(byTodayOrder);
    const parts = [];
    if (inbox.length === 0) parts.push(hint("empty", "Inbox is clear"));
    else parts.push(group("Inbox", inbox, ["today", "later", "never"], false));
    if (later.length > 0) parts.push(group("Later", later, ["today", "never"], false));
    if (today.length > 0) parts.push(group("Today", today, [], true));
    list.replaceChildren(...parts);
    list.querySelectorAll("li[data-id]").forEach((li) => {
      if (pending.has(li.dataset.id)) lock(li);
    });
    hideError();
  }

  list.addEventListener("click", async (event) => {
    const btn = event.target.closest("button[data-action]");
    const li = btn?.closest("li[data-id]");
    if (!btn || !li) return;
    const action = btn.dataset.action;
    const id = li.dataset.id;
    if (pending.has(id)) return;
    pending.add(id);
    lock(li);
    tg?.HapticFeedback?.impactOccurred("light");
    const body = action === "never"
      ? { action: "never", id }
      : { action: "move", id, to: action };
    const seq = ++lastSeq;
    try {
      const answer = await post(body);
      pending.delete(id);
      if (seq === lastSeq) render(answer.tasks);
      else unlock(id);
    } catch {
      pending.delete(id);
      unlock(id);
      showError("Could not save. Try again.");
    }
  });

  async function load() {
    const seq = ++lastSeq;
    try {
      const answer = await post({ action: "list" });
      if (seq === lastSeq) render(answer.tasks);
    } catch {
      showError("Could not load. Try again.", { sticky: true });
    }
  }

  if (initData === "") {
    list.replaceChildren(hint("outside", "Open this page from the bot."));
  } else {
    tg.ready();
    tg.expand();
    load();
  }
</script>
</body>
</html>
