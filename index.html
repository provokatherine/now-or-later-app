<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inbox</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #efeff4);
    --card: var(--tg-theme-section-bg-color, #fff);
    --sep: var(--tg-theme-section-separator-color, rgba(0, 0, 0, .1));
    --text: var(--tg-theme-text-color, #000);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #fff);
    --head: var(--tg-theme-section-header-text-color, #6d6d72);
    --danger: var(--tg-theme-destructive-text-color, #ff3b30);
    --safe-bottom: max(var(--tg-safe-area-inset-bottom, 0px), env(safe-area-inset-bottom, 0px));
    --ms: 200ms;
  }
  @media (prefers-reduced-motion: reduce) { :root { --ms: 0ms; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body {
    margin: 0;
    padding: 0 16px calc(96px + var(--safe-bottom));
    color: var(--text);
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow-wrap: anywhere;
    overflow-x: hidden;
    overscroll-behavior-x: none;
  }
  #banner {
    position: sticky;
    top: 0;
    z-index: 3;
    margin: 0 -16px;
    padding: 10px 16px;
    background: var(--card);
    color: var(--text);
    border-bottom: 1px solid var(--sep);
  }
  #banner[hidden] { display: none; }
  .add {
    position: sticky;
    top: 0;
    z-index: 2;
    margin: 0 -16px;
    padding: 8px 16px;
    background: var(--bg);
  }
  textarea {
    display: block;
    width: 100%;
    min-height: 44px;
    max-height: 40vh;
    margin: 0;
    padding: 11px 12px;
    border: 0;
    border-radius: 12px;
    background: var(--card);
    color: var(--text);
    font: inherit;
    resize: none;
    outline: 0;
  }
  textarea::placeholder { color: var(--hint); }
  h2 {
    margin: 16px 16px 6px;
    font-size: 13px;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: .02em;
    color: var(--head);
  }
  h2 .count { display: inline-block; color: var(--hint); margin-left: 6px; }
  .count.bump { animation: bump 300ms ease-out; }
  @keyframes bump { 40% { transform: scale(1.2); color: var(--accent); } }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
  }
  li {
    position: relative;
    overflow: hidden;
    background: var(--card);
    touch-action: pan-y;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    transition: max-height var(--ms) ease-out, opacity var(--ms) ease-out, transform var(--ms) ease-out;
  }
  li.lifting { z-index: 1; transition: none; box-shadow: 0 2px 10px rgba(0, 0, 0, .3); }
  li + li { border-top: 1px solid var(--sep); }
  li.collapse { max-height: 0 !important; opacity: 0; border-top-color: transparent; }
  li.flash { animation: flash 1s ease-out; }
  @keyframes flash { from { background: var(--bg); } to { background: var(--card); } }
  li.now { background: var(--text); color: var(--card); }
  li.now.flash { animation: none; }
  li.now.arrive { animation: arrive var(--ms) ease-out var(--ms) both; }
  @keyframes arrive { from { background: var(--card); color: var(--text); } }
  li.now button[data-action="later"] { color: color-mix(in srgb, var(--card) 62%, var(--text)); }
  .slide {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    padding: 0 4px 0 12px;
    background: inherit;
    transition: transform var(--ms) cubic-bezier(.2, .8, .2, 1);
  }
  .binbg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    background: var(--danger);
    color: #fff;
    visibility: hidden;
  }
  li.swiping .binbg, li.open .binbg { visibility: visible; }
  .bin { width: 22px; height: 22px; margin-right: 29px; }
  .sr { position: absolute; width: 1px; height: 1px; min-height: 0; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .box {
    position: relative;
    flex: none;
    width: 22px;
    height: 22px;
    min-height: 0;
    margin: 11px 0;
    padding: 0;
    border: 1.5px solid var(--hint);
    border-radius: 50%;
    background: transparent;
    color: transparent;
    font-size: 14px;
    line-height: 1;
    transition: background 300ms, border-color 300ms, color 300ms;
  }
  .box::before { content: ""; position: absolute; inset: -11px; }
  li.checked .box { background: var(--accent); border-color: var(--accent); color: #fff; }
  .body { flex: 1 1 0; min-width: 0; padding: 10px 0; }
  .was { display: block; font-size: 13px; color: var(--hint); margin-top: 2px; }
  .was button { font-size: 13px; padding: 0 0 0 4px; min-height: 0; }
  button {
    font: inherit;
    font-size: 15px;
    min-height: 44px;
    padding: 0 10px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--accent);
  }
  button:active { opacity: .5; }
  button:disabled { opacity: .4; }
  button[data-action="later"] { color: color-mix(in srgb, var(--text) 62%, var(--card)); }
  .empty, .outside { color: var(--hint); padding: 12px 16px; margin: 0; }
  .outside { padding-top: 24px; }
  #toast {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(12px + var(--safe-bottom));
    z-index: 4;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 48px;
    padding: 4px 4px 4px 16px;
    border-radius: 12px;
    background: var(--text);
    color: var(--bg);
    box-shadow: 0 4px 16px rgba(0, 0, 0, .2);
    transition: opacity var(--ms) ease-out, transform var(--ms) ease-out;
  }
  #toast[hidden] { display: none; }
  #toast .msg { flex: 1 1 0; }
  #toast button { color: var(--bg); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  #toast button[hidden] { display: none; }
  .ring { width: 18px; height: 18px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-dasharray: 44; stroke-dashoffset: 0; }
  #toast.counting .ring circle { animation: ring 5s linear forwards; }
  @keyframes ring { to { stroke-dashoffset: 44; } }
</style>
</head>
<body>
<div id="banner" hidden></div>
<div class="add" id="add"><textarea id="field" rows="1" placeholder="Add tasks, one per line" enterkeyhint="enter" autocomplete="off"></textarea></div>
<main id="list"></main>
<div id="toast" hidden><span class="msg" id="msg"></span><button id="undo" type="button"><svg class="ring" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7"></circle></svg>Undo</button></div>
<template id="buttons"><button data-action="today">Today</button><button data-action="later">Later</button><button class="sr" data-action="never">Delete</button><button data-action="not_same">Not the same</button></template>
<template id="bintpl"><div class="binbg" aria-hidden="true"><svg class="bin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></div></template>
<script>
  const tg = window.Telegram?.WebApp;
  const initData = tg?.initData ?? "";
  const list = document.getElementById("list");
  const banner = document.getElementById("banner");
  const addBox = document.getElementById("add");
  const field = document.getElementById("field");
  const toast = document.getElementById("toast");
  const msg = document.getElementById("msg");
  const undoBtn = document.getElementById("undo");
  const buttons = document.getElementById("buttons").content;
  const bintpl = document.getElementById("bintpl").content;
  // Filled by renderPage: the function's API, absolute when the page is hosted elsewhere.
  const api = "https://yonytrycngydbxxnblqv.supabase.co/functions/v1/today-bot/app/api";
  const MS = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 200;
  const HOLD = 300; // the filled checkbox stays this long before a done row goes (fixed, a second tap cancels)
  const LIFT = 300; // a press on a Today row held this long lifts it for reordering
  // Swipe to delete
  const REVEAL = 80; // px of bin shown by an open row
  const OPEN_AT = 40; // px of drag that opens the row on release
  const LOCK = 10; // px of movement that decides between a swipe and a scroll
  const COMMIT = 0.55; // share of the row width past which a release deletes
  const EDGE = 20; // px at the left screen edge left to the system back gesture

  let tasks = [];
  let loaded = false;
  let busy = 0; // requests not yet answered
  let queue = Promise.resolve(); // requests go one at a time
  let undo = null; // { id, status, todayOrder, expect }
  let bannerTimer = null;
  let toastTimer = null;
  let bannerRetry = false;
  const reworded = new Map(); // id -> old wording, shown until the page closes

  // --- Telegram ---------------------------------------------------------------

  function haptic(kind) {
    const h = tg?.HapticFeedback;
    if (!h) return;
    if (kind === "success" || kind === "warning" || kind === "error") h.notificationOccurred(kind);
    else if (kind === "select") h.selectionChanged();
    else if (kind === "medium") h.impactOccurred("medium");
    else h.impactOccurred("light");
  }

  function lineCount() {
    return field.value.split("\n").filter((l) => l.trim() !== "").length;
  }

  function updateMainButton() {
    const n = lineCount();
    if (n === 0) tg.MainButton.hide();
    else tg.MainButton.setParams({ text: n === 1 ? "Add" : "Add " + n, is_visible: true });
  }

  // --- Network ----------------------------------------------------------------

  async function post(body) {
    const res = await fetch(api, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ initData, ...body }),
    });
    if (!res.ok) {
      const e = new Error("HTTP " + res.status);
      e.status = res.status;
      throw e;
    }
    return res.json();
  }

  // One request at a time. The answer's tasks are shown only when nothing else is in flight,
  // so an optimistic change is never overwritten by an older answer.
  function send(body) {
    busy++;
    tg?.enableClosingConfirmation();
    const run = queue.then(() => post(body));
    queue = run.catch(() => {});
    return run.finally(() => {
      busy--;
      if (busy === 0) tg?.disableClosingConfirmation();
    });
  }

  function failed(e) {
    hideToast();
    haptic("error");
    if (e && e.status === 401) showBanner("Session expired. Reopen the app.", { sticky: true });
    else showBanner("Not saved. Try again.");
    load(); // put the rows back as the server has them
  }

  // --- Banner and toast ---------------------------------------------------------

  function showBanner(message, { sticky = false, retry = false } = {}) {
    banner.textContent = message;
    banner.hidden = false;
    bannerRetry = retry;
    clearTimeout(bannerTimer);
    if (!sticky) bannerTimer = setTimeout(hideBanner, 4000);
  }

  function hideBanner() {
    clearTimeout(bannerTimer);
    banner.hidden = true;
    bannerRetry = false;
  }

  banner.addEventListener("click", () => { if (bannerRetry) load(); });

  function showToast(message, withUndo) {
    clearTimeout(toastTimer);
    msg.textContent = message;
    undoBtn.hidden = !withUndo;
    toast.classList.remove("counting");
    toast.hidden = false;
    if (withUndo) {
      void toast.offsetWidth; // restart the ring
      toast.classList.add("counting");
    }
    toastTimer = setTimeout(hideToast, 5000);
  }

  function hideToast() {
    clearTimeout(toastTimer);
    toast.hidden = true;
    undo = null;
  }

  // --- Rendering ----------------------------------------------------------------

  function byCreated(a, b) {
    return a.createdAt < b.createdAt ? -1 : a.createdAt > b.createdAt ? 1 : 0;
  }

  function byTodayOrder(a, b) {
    const x = a.todayOrder ?? Infinity;
    const y = b.todayOrder ?? Infinity;
    return x !== y ? x - y : byCreated(a, b);
  }

  const todayTasks = () => tasks.filter((t) => t.status === "today").sort(byTodayOrder);
  const inboxTasks = () => tasks.filter((t) => t.status !== "today").sort(byCreated).reverse();

  function button(action) {
    return buttons.querySelector('[data-action="' + action + '"]').cloneNode(true);
  }

  function row(task, actions, now) {
    const li = document.createElement("li");
    li.dataset.id = task.id;
    if (now) {
      li.className = "now";
      li.setAttribute("aria-current", "true");
    }
    li.append(bintpl.cloneNode(true));
    const slide = document.createElement("div");
    slide.className = "slide";
    li.append(slide);
    const box = document.createElement("button");
    box.className = "box";
    box.dataset.action = "done";
    box.setAttribute("aria-label", "Done");
    box.textContent = "✓";
    slide.append(box);
    const body = document.createElement("span");
    body.className = "body";
    body.textContent = task.description;
    const old = reworded.get(task.id);
    if (old !== undefined) {
      const was = document.createElement("span");
      was.className = "was";
      was.textContent = "was: " + old + " ·";
      was.append(button("not_same"));
      body.append(was);
    }
    slide.append(body);
    for (const a of actions) slide.append(button(a));
    return li;
  }

  function group(title, items, actions, ordered) {
    const section = document.createElement("section");
    const h2 = document.createElement("h2");
    h2.dataset.title = title;
    const count = document.createElement("span");
    count.className = "count";
    count.textContent = loaded ? String(items.length) : "";
    h2.append(title, count);
    const ul = document.createElement("ul");
    if (ordered) ul.className = "ordered";
    items.forEach((t, i) => ul.append(row(t, actions, ordered && i === 0)));
    section.append(h2);
    if (items.length > 0) section.append(ul);
    return section;
  }

  function render() {
    list.replaceChildren(
      group("Today", todayTasks(), ["later", "never"], true),
      group("Inbox", inboxTasks(), ["today", "never"], false),
    );
  }

  // Pulses the count in a list header: the row went there.
  function bump(title) {
    const count = list.querySelector('h2[data-title="' + title + '"] .count');
    if (!count) return;
    count.classList.remove("bump");
    void count.offsetWidth;
    count.classList.add("bump");
  }

  function rowOf(id) {
    return [...list.querySelectorAll("li[data-id]")].find((li) => li.dataset.id === id) ?? null;
  }

  function flash(id, scroll) {
    const li = rowOf(id);
    if (!li) return;
    if (scroll) li.scrollIntoView({ block: "center", behavior: MS ? "smooth" : "auto" });
    li.classList.remove("flash");
    void li.offsetWidth;
    li.classList.add("flash");
  }

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  async function collapse(li) {
    li.style.maxHeight = li.offsetHeight + "px";
    void li.offsetWidth;
    li.classList.add("collapse");
    await wait(MS);
  }

  // Re-renders and slides the Today rows that changed place (FLIP).
  function renderMoved() {
    const before = new Map([...list.querySelectorAll("li[data-id]")].map((li) => [li.dataset.id, li.getBoundingClientRect().top]));
    render();
    if (MS === 0) return;
    for (const li of list.querySelectorAll("li[data-id]")) {
      const from = before.get(li.dataset.id);
      if (from === undefined) continue;
      const d = from - li.getBoundingClientRect().top;
      if (d === 0) continue;
      li.style.transition = "none";
      li.style.transform = "translateY(" + d + "px)";
      void li.offsetWidth;
      li.style.transition = "";
      li.style.transform = "";
    }
    list.querySelector("li.now")?.classList.add("arrive");
  }

  // --- Actions ------------------------------------------------------------------

  function nextOrder() {
    const orders = tasks.filter((t) => t.todayOrder !== null).map((t) => t.todayOrder);
    return orders.length ? Math.max(...orders) + 1 : 1;
  }

  function patch(id, change) {
    tasks = tasks.map((t) => (t.id === id ? { ...t, ...change } : t));
  }

  // Every action changes the page at once. Only delete offers Undo; the others show where the
  // row went (tick and collapse, count pulse, slide).
  async function act(action, task, li) {
    let body;
    if (action === "done") {
      haptic("success");
      li.classList.add("checked");
      await wait(HOLD);
      if (!li.classList.contains("checked")) return; // a second tap cancelled it
      await collapse(li);
      tasks = tasks.filter((t) => t.id !== task.id);
      body = { action: "done", id: task.id };
    } else if (action === "never") {
      haptic("warning");
      if (openLi === li) openLi = null;
      li.classList.add("swiping");
      setX(li, -li.offsetWidth, true);
      await wait(MS * 0.75);
      await collapse(li);
      tasks = tasks.filter((t) => t.id !== task.id);
      body = { action: "never", id: task.id };
      undo = { id: task.id, status: task.status, todayOrder: task.todayOrder, expect: "never" };
    } else if (action === "later") {
      haptic("light");
      await collapse(li);
      patch(task.id, { status: "later", todayOrder: null });
      body = { action: "move", id: task.id, to: "later" };
    } else if (action === "today") {
      haptic("light");
      await collapse(li);
      patch(task.id, { status: "today", todayOrder: nextOrder() });
      body = { action: "move", id: task.id, to: "today" };
    } else return;
    render();
    if (action === "never") showToast("Deleted", true);
    if (action === "later") bump("Inbox");
    if (action === "today") { bump("Today"); flash(task.id, false); }
    await save(body);
  }

  async function save(body) {
    try {
      const answer = await send(body);
      if (busy === 0) { tasks = answer.tasks; render(); }
    } catch (e) {
      failed(e);
    }
  }

  async function notSame(id) {
    haptic("light");
    try {
      const answer = await send({ action: "not_same", id });
      reworded.delete(id);
      if (busy === 0) { tasks = answer.tasks; render(); }
      flash(answer.addedId, true);
      showToast("Added 1 to Inbox", false);
    } catch (e) {
      failed(e);
    }
  }

  list.addEventListener("click", (event) => {
    const el = event.target.closest("[data-action]");
    const li = el?.closest("li[data-id]");
    if (!el || !li || !el.dataset.action) return;
    const id = li.dataset.id;
    const task = tasks.find((t) => t.id === id);
    if (!task || li.classList.contains("collapse")) return;
    if (el.dataset.action === "done" && li.classList.contains("checked")) {
      li.classList.remove("checked"); // not done after all
      haptic("light");
    } else if (el.dataset.action === "not_same") notSame(id);
    else act(el.dataset.action, task, li);
  });

  // --- Swipe to delete, drag to reorder --------------------------------------------
  // A drag to the left on a row reveals the bin; a tap on it deletes. A drag past COMMIT
  // of the row width deletes on release. The first LOCK px decide: a swipe within 30° of
  // horizontal, otherwise the page scrolls. A swipe is never a tap.
  // A press on a Today row held for LIFT ms without moving lifts the row (lock "r"); a drag
  // up or down then moves it among the Today rows and release saves the order. Whichever
  // row lands first is the main task.

  let drag = null; // { id, li, x0, y0, lock, wasOpen, x, opened, committed, rows, from, to, h, tops }
  let liftTimer = null;
  let openLi = null; // the row showing its bin, at most one
  let suppressClick = false;

  function setX(li, x, animate) {
    const slide = li.querySelector(".slide");
    slide.style.transition = animate ? "" : "none";
    slide.style.transform = x ? "translateX(" + x + "px)" : "";
    li.querySelector(".bin").style.transform = x < -REVEAL ? "translateX(" + (x + REVEAL) + "px)" : "";
  }

  function closeRow(li) {
    if (!li) return;
    li.classList.remove("open", "commit");
    setX(li, 0, true);
    if (openLi === li) openLi = null;
  }

  list.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    const li = e.target.closest("li[data-id]");
    suppressClick = false;
    if (openLi && openLi !== li) {
      closeRow(openLi); // a tap elsewhere closes the open row and does nothing else
      suppressClick = true;
    }
    if (!li || li.classList.contains("collapse") || e.clientX < EDGE) return;
    drag = { id: e.pointerId, li, x0: e.clientX, y0: e.clientY, lock: null, wasOpen: li === openLi, x: 0, opened: false, committed: false };
    const ul = li.parentElement;
    if (!drag.wasOpen && ul.classList.contains("ordered") && ul.children.length > 1) liftTimer = setTimeout(lift, LIFT);
  });

  function cancelLift() {
    clearTimeout(liftTimer);
    liftTimer = null;
  }

  function lift() {
    liftTimer = null;
    if (!drag || drag.lock !== null) return;
    const d = drag;
    d.rows = [...d.li.parentElement.children];
    d.from = d.to = d.rows.indexOf(d.li);
    d.h = d.li.offsetHeight;
    d.tops = d.rows.map((r) => r.getBoundingClientRect().top);
    d.lock = "r";
    d.li.classList.add("lifting");
    try { d.li.setPointerCapture(d.id); } catch (_) { /* the pointer is gone */ }
    suppressClick = true;
    haptic("medium");
  }

  function moveLifted(e) {
    const d = drag;
    const dy = e.clientY - d.y0;
    d.li.style.transform = "translateY(" + dy + "px)";
    const mid = d.tops[d.from] + dy + d.h / 2;
    let to = 0;
    d.rows.forEach((r, i) => { if (i !== d.from && d.tops[i] + r.offsetHeight / 2 < mid) to++; });
    if (to === d.to) return;
    d.to = to;
    haptic("select");
    d.rows.forEach((r, i) => {
      if (i === d.from) return;
      const y = i > d.from && i <= to ? -d.h : i < d.from && i >= to ? d.h : 0;
      r.style.transform = y ? "translateY(" + y + "px)" : "";
    });
  }

  function dropLifted(d, to) {
    d.li.classList.remove("lifting");
    if (to === d.from) {
      d.rows.forEach((r) => { r.style.transform = ""; });
      return;
    }
    const ids = d.rows.map((r) => r.dataset.id);
    ids.splice(to, 0, ids.splice(d.from, 1)[0]);
    ids.forEach((id, i) => patch(id, { todayOrder: i + 1 }));
    renderMoved();
    save({ action: "reorder", ids });
  }

  list.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    if (drag.lock === "r") return moveLifted(e);
    const dx = e.clientX - drag.x0;
    const dy = e.clientY - drag.y0;
    if (drag.lock === null) {
      if (Math.abs(dx) >= LOCK && Math.abs(dx) > 1.73 * Math.abs(dy)) {
        drag.lock = "h";
        drag.li.classList.add("swiping");
        drag.li.setPointerCapture(e.pointerId);
      } else if (Math.abs(dy) >= LOCK) drag.lock = "v";
      if (drag.lock !== null) cancelLift();
    }
    if (drag.lock !== "h") return;
    const width = drag.li.offsetWidth;
    const x = Math.max(-width, Math.min(0, (drag.wasOpen ? -REVEAL : 0) + dx));
    drag.x = x;
    setX(drag.li, x, false);
    const opened = x <= -OPEN_AT;
    if (opened && !drag.opened) haptic("select");
    drag.opened = opened;
    const committed = -x >= COMMIT * width;
    if (committed !== drag.committed) {
      haptic(committed ? "medium" : "select");
      drag.li.classList.toggle("commit", committed);
    }
    drag.committed = committed;
  });

  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    cancelLift();
    const d = drag;
    drag = null;
    const task = tasks.find((t) => t.id === d.li.dataset.id);
    if (d.lock === "r") dropLifted(d, e.type === "pointercancel" ? d.from : d.to);
    else if (d.lock === "h") {
      suppressClick = true;
      d.li.classList.remove("swiping");
      if (d.committed && task) act("never", task, d.li);
      else if (d.x <= -OPEN_AT) {
        d.li.classList.add("open");
        setX(d.li, -REVEAL, true);
        openLi = d.li;
      } else closeRow(d.li);
    } else if (d.lock === null && d.wasOpen) {
      suppressClick = true; // a tap on an open row: the bin deletes, anything else closes
      if (e.target.closest(".binbg") && task) act("never", task, d.li);
      else closeRow(d.li);
    } else if (d.lock === "v") closeRow(d.li);
  }
  list.addEventListener("pointerup", endDrag);
  list.addEventListener("pointercancel", endDrag);
  list.addEventListener("touchmove", (e) => { if (drag && drag.lock === "r") e.preventDefault(); }, { passive: false });
  list.addEventListener("contextmenu", (e) => { if (drag) e.preventDefault(); });
  list.addEventListener("click", (e) => {
    if (!suppressClick) return;
    e.stopPropagation();
    e.preventDefault();
    suppressClick = false;
  }, true);
  addEventListener("scroll", () => closeRow(openLi), { passive: true });
  document.addEventListener("visibilitychange", () => { if (document.hidden) closeRow(openLi); });

  // The first time: the top row shows its bin for a moment, so the gesture can be found.
  function peek() {
    const li = list.querySelector("li[data-id]");
    if (!li || MS === 0) return;
    const slide = li.querySelector(".slide");
    li.classList.add("swiping");
    slide.style.transition = "transform 250ms ease-in-out";
    slide.style.transform = "translateX(-48px)";
    setTimeout(() => {
      slide.style.transform = "";
      setTimeout(() => { slide.style.transition = ""; li.classList.remove("swiping"); }, 250);
    }, 850);
  }

  function peekOnce() {
    const store = tg.CloudStorage;
    if (!store || !tg.isVersionAtLeast("6.9")) return;
    store.getItem("swipeHint", (err, value) => {
      if (err || value) return;
      setTimeout(() => {
        if (!list.querySelector("li[data-id]")) return;
        peek();
        store.setItem("swipeHint", "1", () => {});
      }, 700);
    });
  }

  undoBtn.addEventListener("click", async () => {
    const u = undo;
    hideToast();
    if (!u) return;
    haptic("light");
    try {
      const answer = await send({ action: "undo", id: u.id, status: u.status, todayOrder: u.todayOrder, expect: u.expect });
      if (busy === 0) { tasks = answer.tasks; render(); }
      flash(u.id, true);
    } catch (e) {
      failed(e);
    }
  });

  // --- Add ----------------------------------------------------------------------

  function addSummary(results) {
    const added = results.filter((r) => r.outcome === "added").length;
    const exact = results.filter((r) => r.outcome === "exact").length;
    const updated = results.filter((r) => r.outcome === "reworded").length;
    if (results.length === 1 && exact === 1) {
      const t = tasks.find((x) => x.id === results[0].id);
      return "Already in " + (t && t.status === "today" ? "Today" : "Inbox");
    }
    if (results.length === 1 && updated === 1) return "Updated 1";
    if (exact === 0 && updated === 0) return "Added " + added + " to Inbox";
    const parts = [];
    if (added > 0) parts.push("Added " + added);
    if (exact > 0) parts.push(exact + " already there");
    if (updated > 0) parts.push(updated + " updated");
    return parts.join(" · ");
  }

  async function add() {
    const text = field.value;
    if (lineCount() === 0) return;
    tg.MainButton.showProgress(false);
    field.disabled = true;
    try {
      const answer = await send({ action: "add", text });
      field.value = "";
      field.style.height = "";
      field.blur();
      tasks = answer.tasks;
      for (const r of answer.results) if (r.outcome === "reworded") reworded.set(r.id, r.prevDescription);
      render();
      const results = answer.results;
      const allExact = results.length > 0 && results.every((r) => r.outcome === "exact");
      haptic(allExact ? "warning" : "success");
      results.forEach((r, i) => flash(r.id, i === 0));
      if (results.length > 0) showToast(addSummary(results), false);
    } catch (e) {
      failed(e);
    } finally {
      field.disabled = false;
      tg.MainButton.hideProgress();
      updateMainButton();
    }
  }

  field.addEventListener("input", () => {
    field.style.height = "";
    field.style.height = field.scrollHeight + "px";
    updateMainButton();
  });

  // --- Load ---------------------------------------------------------------------

  async function load() {
    const slow = setTimeout(() => {
      if (!loaded) list.append(Object.assign(document.createElement("p"), { className: "empty", textContent: "Loading…" }));
    }, 800);
    try {
      const answer = await send({ action: "list" });
      clearTimeout(slow);
      const first = !loaded;
      loaded = true;
      if (busy === 0) { tasks = answer.tasks; render(); }
      if (bannerRetry) hideBanner();
      if (first) peekOnce();
    } catch (e) {
      clearTimeout(slow);
      if (e && e.status === 401) showBanner("Session expired. Reopen the app.", { sticky: true });
      else if (!loaded) showBanner("Could not load. Tap to retry.", { sticky: true, retry: true });
    }
  }

  if (initData === "") {
    addBox.hidden = true;
    list.replaceChildren(Object.assign(document.createElement("p"), { className: "outside", textContent: "Open this page from the bot." }));
  } else {
    tg.ready();
    tg.expand();
    tg.setHeaderColor("secondary_bg_color");
    tg.setBackgroundColor("secondary_bg_color");
    if (tg.isVersionAtLeast("7.7")) tg.disableVerticalSwipes();
    tg.MainButton.onClick(add);
    render();
    load();
  }
</script>
</body>
</html>
